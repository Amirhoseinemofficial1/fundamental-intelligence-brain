[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v59-impact-routed-fundamental-intelligence"
version = "59.0.0"
description = "Failure-isolated realtime multi-asset fundamental intelligence and controlled learning system"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
v52 = "v52.cli:main"

[project.optional-dependencies]
ml = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "joblib>=1.3,<2"]
boosting = ["xgboost>=2,<4", "lightgbm>=4,<5", "catboost>=1.2,<2"]
deep = ["torch>=2.2,<3"]
temporal = ["torch>=2.2,<3"]
full = ["numpy>=1.24,<2.3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "joblib>=1.3,<2", "xgboost>=2,<4", "lightgbm>=4,<5", "catboost>=1.2,<2", "torch>=2.2,<3"]
